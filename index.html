<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166534" />

    <!-- Google Search & Site Title -->
    <title>Beacon Wings Foundation (BWF) - Hope. Freedom. Empowerment.</title>
    <meta
      name="description"
      content="Beacon Wings Foundation (BWF) is a registered NGO in India empowering underprivileged communities through child education, free healthcare camps, elder care, food relief, and volunteer programs."
    />
    <meta
      name="keywords"
      content="Beacon Wings Foundation, BWF, Beacon Wings, NGO Delhi, NGO India, Child Care & Education, Healthcare Camp, Volunteer India, Donate NGO"
    />
    <meta name="author" content="Beacon Wings Foundation" />

    <!-- Official Favicon & Google Search Results Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/images/logo.jpeg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph Meta Tags (Google Discover, WhatsApp & Social Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beacon Wings Foundation" />
    <meta property="og:title" content="Beacon Wings Foundation (BWF) - Hope. Freedom. Empowerment." />
    <meta
      property="og:description"
      content="Registered NGO dedicated to child education, healthcare camps, food relief, and grassroots community empowerment across India."
    />
    <meta property="og:image" content="/images/logo.jpeg" />
    <meta property="og:image:alt" content="Beacon Wings Foundation Official Logo" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Beacon Wings Foundation (BWF)" />
    <meta
      name="twitter:description"
      content="Hope. Freedom. Empowerment. Dedicated NGO empowering communities across India."
    />
    <meta name="twitter:image" content="/images/logo.jpeg" />

    <!-- Google Search Organization / NGO Structured Data (JSON-LD) for Logo & Knowledge Panel -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Beacon Wings Foundation",
        "alternateName": "BWF",
        "url": "https://beaconwingsfoundation.web.app",
        "logo": "https://beaconwingsfoundation.web.app/images/logo.jpeg",
        "image": "https://beaconwingsfoundation.web.app/images/logo.jpeg",
        "description": "Beacon Wings Foundation is a non-profit organization in India dedicated to child education, healthcare drives, elder care, food relief, and community welfare.",
        "telephone": "+91 7275982849",
        "email": "beaconwings2026@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "E-49/5 First Floor Okhla Industrial Area Phase II",
          "addressLocality": "New Delhi",
          "postalCode": "110020",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Prevent flash of light mode: apply dark class before first paint -->
    <script>
      (function () {
        var s = localStorage.getItem('iiwc_theme');
        if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
